name: validate

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save jsdom
      # Syntax + metadata. A userscript with a parse error fails silently in
      # the extension, so this gate matters more than it looks.
      # The demo loads a generated bundle; drift between it and the sources
      # would mean the preview silently runs an older toolkit.
      - run: node build/bundle.js --check
      - run: node build/validate.js
      # Behavioural tests drive the real demo page in jsdom. The interesting
      # bugs in browser automation are all in the interaction, not the logic.
      - run: node tests/toolkit.test.js
      - run: node tests/workflow.test.js
      - run: node tests/buttons.test.js
      # Checks the README's factual claims against a live run. Documentation
      # that drifts from the code is worse than none: it is confidently wrong.
      # Proves the marker verification claim in the README.
      - run: node tests/verification.test.js
      - run: node tests/readme.test.js
